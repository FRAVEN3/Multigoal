name: Aggiornamento settimanale

on:
  schedule:
    - cron: "0 6 * * 1"    # lunedì: risultati del weekend e controllo bollette
    - cron: "0 6 * * 3"    # mercoledì: turno infrasettimanale
    - cron: "0 15 * * 5"   # venerdì: calendario e bollette del weekend
  workflow_dispatch: {}     # pulsante "Run workflow" per aggiornare a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Salva i nuovi dati
        run: |
          git config user.name "multigol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs state data/backtest.json
          git diff --cached --quiet || git commit -m "Aggiornamento $(date +%d/%m/%Y)"
          git push
