name: Aggiornamento giornaliero

on:
  schedule:
    - cron: "0 6 * * *"    # ogni giorno alle 6:00 UTC (7:00 in Italia d'inverno, 8:00 d'estate)
  workflow_dispatch: {}     # pulsante "Run workflow" per aggiornare a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dati ESPN già scaricati (marcatori)
        uses: actions/cache@v4
        with:
          path: data/espn
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      - run: python build.py
      - name: Salva i nuovi dati
        run: |
          git config user.name "multigol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs state data/backtest.json
          git diff --cached --quiet || git commit -m "Aggiornamento $(date +%d/%m/%Y)"
          git push
